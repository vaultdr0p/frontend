name: Test and build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_call: # allows this workflow to be called from another workflow

# Least privilege: the only job that touches the repository checks it out and
# reads it. Nothing here writes to the repository, so no other scope is
# granted. Every unlisted scope is set to none by declaring this block.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: yarn install
      - run: yarn build

  complete:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    # This job only inspects the results of its dependencies and exits. It
    # needs no access to the repository at all.
    permissions: {}
    steps:
      - if:
          contains(needs.*.result, 'failure') || contains(needs.*.result,
          'cancelled')
        run: exit 1
